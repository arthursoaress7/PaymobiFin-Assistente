name: Preparar release

# A cada merge na development, abre ou atualiza o PR de release (release/proxima -> main):
#   - a release/proxima parte da MAIN e junta a development (merge commit). Assim o PR de
#     release não tem conflito com os commits de release que só existem na main, e a
#     development não precisa receber a main de volta (isso só acontece depois de hotfix);
#   - calcula a próxima versão pelos commits da development que ainda não estão na main;
#   - atualiza o @version, os locais de versão da documentação (item 12 do instructions.md)
#     e o CHANGELOG.md (.github/scripts/preparar_release.py);
#   - o merge na main é sempre feito pelo responsável (um clique).
#
# Token: usa o secret RELEASE_TOKEN (PAT) para que o PR criado aqui rode a validação.
# Sem ele, o PR é criado com o GITHUB_TOKEN e a verificação "Validar alterações" não roda nele.

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preparar-release
  cancel-in-progress: true

jobs:
  release-pr:
    name: Abrir ou atualizar o PR de release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      RAMO: release/proxima
    steps:
      - name: Checkout (development, histórico completo)
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Há algo para levar à main?
        id: dif
        run: |
          git fetch origin main
          # commits da development que a main ainda não tem (a main tem os commits de release,
          # que a development não recebe: por isso não se compara o conteúdo)
          if [ -z "$(git rev-list origin/main..HEAD)" ]; then
            echo "Nada novo: a main já contém a development."
            echo "vazio=true" >> "$GITHUB_OUTPUT"
          else
            echo "vazio=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Montar a release/proxima (main + development)
        if: steps.dif.outputs.vazio == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DEV=$(git rev-parse HEAD)
          # Fora os commits de release (versão, CHANGELOG, URLs), a main não pode ter nada que
          # a development não tenha. Se tiver, é hotfix que ainda não voltou: integrar antes.
          PENDENTE=$(git log --no-merges --format='%h %s' "$DEV..origin/main" \
            | grep -vE '^[0-9a-f]+ chore: (release v|integrar development na main|mantém as URLs de teste)' || true)
          if [ -n "$PENDENTE" ]; then
            echo "::error::A main tem correções que não voltaram para a development. Integre o PR de sincronização (chore/sync-main-*) e rode o Preparar release de novo."
            echo "$PENDENTE"
            exit 1
          fi
          git checkout -B "$RAMO" origin/main
          # Os únicos conflitos possíveis são nas linhas que só a main muda (versão nos locais do
          # item 12, URLs): a development vence e o preparar_release.py recalcula a versão a
          # partir da main logo depois.
          if ! git merge --no-ff --no-edit -X theirs "$DEV" -m "chore: integra a development na release"; then
            git merge --abort || true
            echo "::error::Não foi possível juntar a development na main (conflito que o -X theirs não resolve, ex.: arquivo apagado de um lado). Resolva à mão."
            exit 1
          fi

      - name: Fechar PR de release sem conteúdo
        if: steps.dif.outputs.vazio == 'true'
        run: |
          N=$(gh pr list --head "$RAMO" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$N" ]; then
            gh pr close "$N" --comment "Fechado automaticamente: a main já contém a development." --delete-branch
          fi

      - name: Calcular versão e atualizar arquivos
        if: steps.dif.outputs.vazio == 'false'
        id: rel
        run: python3 .github/scripts/preparar_release.py

      - name: Conferir sintaxe do script e URLs de produção
        if: steps.dif.outputs.vazio == 'false'
        run: |
          node --check paymobifin-assistente.user.js
          # a main nunca pode receber as URLs da development (todos os usuários iriam para o teste)
          if grep -qE '^// @(downloadURL|updateURL) .*/refs/heads/development/' paymobifin-assistente.user.js; then
            echo "❌ URLs da development no PR de release."; exit 1
          fi

      - name: Publicar a branch release/proxima
        if: steps.dif.outputs.vazio == 'false'
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "${{ steps.rel.outputs.titulo }}"
          fi
          git push --force origin "$RAMO"

      - name: Abrir ou atualizar o PR
        if: steps.dif.outputs.vazio == 'false'
        env:
          TITULO: ${{ steps.rel.outputs.titulo }}
        run: |
          N=$(gh pr list --head "$RAMO" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$N" ]; then
            gh pr edit "$N" --title "$TITULO" --body-file /tmp/release_corpo.md
            echo "PR #$N atualizado: $TITULO"
          elif gh pr create --head "$RAMO" --base main --title "$TITULO" --body-file /tmp/release_corpo.md; then
            echo "PR de release criado: $TITULO"
          else
            # sem permissão para o Actions criar PRs (configuração do proprietário pendente):
            # a branch já está publicada; o PR é aberto à mão
            echo "::warning::O GitHub não permitiu ao Actions abrir o PR. Abra à mão: release/proxima -> main, título '$TITULO'."
            {
              echo "## ⚠️ Abrir o PR de release à mão"
              echo ""
              echo "A branch \`release/proxima\` está pronta. Abra o PR para a \`main\` com o título **$TITULO**:"
              echo "https://github.com/${{ github.repository }}/compare/main...release/proxima?expand=1"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## PR de release"
            echo ""
            echo "**$TITULO** (${{ steps.rel.outputs.commits }} commits; incremento: ${{ steps.rel.outputs.incremento }})"
          } >> "$GITHUB_STEP_SUMMARY"
