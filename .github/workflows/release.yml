name: Release

# Depois de cada merge na main:
#   1. Lê o @version do script. Se a tag vX.Y.Z ainda não existe, cria a tag e a GitHub Release
#      com as notas da seção correspondente do CHANGELOG.md (preparado no PR de release).
#   2. Se a main tiver commits que a development não tem (ex.: o merge do PR de release),
#      cria a branch chore/sync-main-vX.Y.Z (development + merge da main, com as URLs de
#      teste da development) e abre o PR "chore: sincroniza main na development", que a
#      validação integra sozinha (merge commit).
#
# Este workflow não faz commits na main: a versão e o CHANGELOG já chegam prontos pelo
# PR de release (workflow "Preparar release").
#
# Token: usa o secret RELEASE_TOKEN (PAT) para que o PR de sincronização rode a validação
# e o merge automático. Sem ele, o PR é criado com o GITHUB_TOKEN e fica esperando merge manual.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Criar tag e release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ler versão
        id: v
        run: |
          V=$(grep -oP '(?<=@version\s{6})\S+' paymobifin-assistente.user.js)
          echo "versao=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "Tag v$V já existe: nada a publicar."
            echo "nova=false" >> "$GITHUB_OUTPUT"
          else
            echo "nova=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notas da release (CHANGELOG)
        if: steps.v.outputs.nova == 'true'
        run: |
          V="${{ steps.v.outputs.versao }}"
          awk -v cab="## [v$V]" '
            index($0, cab) == 1 { dentro = 1; next }
            dentro && /^## \[/ { exit }
            dentro { print }
          ' CHANGELOG.md > /tmp/notas.md
          [ -s /tmp/notas.md ] || echo "Release v$V" > /tmp/notas.md
          printf '\n---\n**Instalação/Atualização:** o Tampermonkey atualiza automaticamente via `@updateURL` apontando para `main`.\n' >> /tmp/notas.md

      - name: Criar tag e GitHub Release
        if: steps.v.outputs.nova == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v${{ steps.v.outputs.versao }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$V" -m "Release $V"
          git push origin "$V"
          gh release create "$V" --title "PaymobiFin $V" --notes-file /tmp/notas.md
          echo "## ✅ Release $V publicada" >> "$GITHUB_STEP_SUMMARY"

  sincronizar:
    name: Sincronizar main na development
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # A development é o ambiente de teste: o script dela se atualiza pela própria development.
      # Um PR direto main -> development traria as URLs da main e faria quem testa voltar
      # para a versão de produção. Por isso a sincronização é feita numa branch que parte da
      # development, junta a main (merge commit) e devolve as URLs da development.
      - name: Preparar branch de sincronização
        id: sync
        run: |
          git fetch origin development main
          if [ -z "$(git rev-list origin/development..origin/main)" ]; then
            echo "A development já contém a main."
            echo "fazer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          V=$(grep -oP '(?<=@version\s{6})\S+' paymobifin-assistente.user.js)
          RAMO="chore/sync-main-$V"
          echo "ramo=$RAMO" >> "$GITHUB_OUTPUT"
          if [ -n "$(gh pr list --base development --state open --json headRefName --jq '.[] | select(.headRefName | startswith("chore/sync-main-")) | .headRefName')" ]; then
            echo "PR de sincronização já aberto."
            echo "fazer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$RAMO" origin/development
          if ! git merge --no-ff --no-edit origin/main -m "chore: sincroniza main na development (v$V)"; then
            git merge --abort || true
            echo "::warning::Conflito ao juntar a main na development. Sincronize à mão numa branch chore/sync-main-$V (merge commit) e mantenha as URLs da development."
            echo "fazer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .github/scripts/preparar_release.py --urls development
          node --check paymobifin-assistente.user.js
          if ! git diff --quiet; then
            git commit -am "chore: mantém as URLs de teste da development"
          fi
          git push --force origin "$RAMO"
          echo "fazer=true" >> "$GITHUB_OUTPUT"

      - name: Abrir PR de sincronização
        if: steps.sync.outputs.fazer == 'true'
        env:
          RAMO: ${{ steps.sync.outputs.ramo }}
        run: |
          if gh pr create --head "$RAMO" --base development \
            --title "chore: sincroniza main na development" \
            --body "Gerado automaticamente depois do merge na main. Traz para a development o que só está na main (versão e CHANGELOG do release) e mantém o @downloadURL/@updateURL apontando para a development (ambiente de teste). Integrado sozinho pela validação (merge commit)."; then
            echo "## PR de sincronização aberto ($RAMO)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::O GitHub não permitiu ao Actions abrir o PR de sincronização. Abra à mão: $RAMO -> development."
            {
              echo "## ⚠️ Abrir o PR de sincronização à mão"
              echo ""
              echo "https://github.com/${{ github.repository }}/compare/development...$RAMO?expand=1 — título: **chore: sincroniza main na development**"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
